# sniplite for Mac: a tag "macos-v<version>" (e.g. macos-v1.0.0) builds the app, runs the tests
# and publishes sniplite_<version>_macos.zip as a GitHub release, with notes in English and
# Chinese (.github/release-notes.sh). Run by hand with a tag, it rewrites that release's notes.
name: macOS release

on:
  push:
    tags: ["macos-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The release whose notes to rewrite, e.g. macos-v1.0.3"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: macos-26        # its SDK gives the app the current look (with an older one, macOS keeps the old look)
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        run: echo "VERSION=${GITHUB_REF_NAME#macos-v}" >> "$GITHUB_ENV"

      - name: Test
        working-directory: macos
        run: ./test.sh

      - name: Build
        working-directory: macos
        run: ./build.sh --zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/release-notes.sh "$VERSION"
          gh release create "$GITHUB_REF_NAME" "macos/build/sniplite_${VERSION}_macos.zip" \
            --title "sniplite for Mac ${VERSION}" --notes-file notes.md

  notes:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          .github/release-notes.sh "${TAG#macos-v}"
          gh release edit "$TAG" --notes-file notes.md
